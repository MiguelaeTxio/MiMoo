[versions]
agp                = "9.2.0"
kotlin             = "2.3.10"
ksp                = "2.3.9"
hilt               = "2.59.2"
hiltNavigate       = "1.2.0"
room               = "2.8.4"
composeBom         = "2026.06.00"
coreKtx            = "1.16.0"
lifecycleRuntime   = "2.9.1"
activityCompose    = "1.10.1"
navigationCompose  = "2.9.0"
retrofit           = "2.11.0"
okhttp             = "4.12.0"
coroutines         = "1.10.2"
coil               = "2.7.0"
chaquopy           = "17.0.0"
media3             = "1.10.1"
work               = "2.10.1"
playServicesAuth   = "21.6.0"

[libraries]
androidx-core-ktx              = { group = "androidx.core",          name = "core-ktx",                   version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",      version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
androidx-activity-compose      = { group = "androidx.activity",      name = "activity-compose",            version.ref = "activityCompose" }
androidx-compose-bom           = { group = "androidx.compose",       name = "compose-bom",                version.ref = "composeBom" }
androidx-compose-ui            = { group = "androidx.compose.ui",    name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui",    name = "ui-graphics" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3     = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-navigation-compose    = { group = "androidx.navigation",    name = "navigation-compose",          version.ref = "navigationCompose" }
hilt-android                   = { group = "com.google.dagger",      name = "hilt-android",               version.ref = "hilt" }
hilt-android-compiler          = { group = "com.google.dagger",      name = "hilt-android-compiler",      version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",          name = "hilt-navigation-compose",    version.ref = "hiltNavigate" }
hilt-work                      = { group = "androidx.hilt",          name = "hilt-work",                  version.ref = "hiltNavigate" }
hilt-work-compiler             = { group = "androidx.hilt",          name = "hilt-compiler",              version.ref = "hiltNavigate" }
androidx-room-runtime          = { group = "androidx.room",          name = "room-runtime",               version.ref = "room" }
androidx-room-ktx              = { group = "androidx.room",          name = "room-ktx",                   version.ref = "room" }
androidx-room-compiler         = { group = "androidx.room",          name = "room-compiler",              version.ref = "room" }
retrofit                       = { group = "com.squareup.retrofit2", name = "retrofit",                   version.ref = "retrofit" }
retrofit-gson                  = { group = "com.squareup.retrofit2", name = "converter-gson",             version.ref = "retrofit" }
okhttp-logging                 = { group = "com.squareup.okhttp3",   name = "logging-interceptor",        version.ref = "okhttp" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose                   = { group = "io.coil-kt",             name = "coil-compose",               version.ref = "coil" }
junit                          = { group = "junit",                  name = "junit",                      version = "4.13.2" }
androidx-junit                 = { group = "androidx.test.ext",      name = "junit",                      version = "1.2.1" }
androidx-espresso-core         = { group = "androidx.test.espresso", name = "espresso-core",              version = "3.6.1" }
androidx-media3-exoplayer      = { group = "androidx.media3",        name = "media3-exoplayer",           version.ref = "media3" }
androidx-media3-exoplayer-hls  = { group = "androidx.media3",        name = "media3-exoplayer-hls",       version.ref = "media3" }
androidx-media3-exoplayer-dash = { group = "androidx.media3",        name = "media3-exoplayer-dash",      version.ref = "media3" }
androidx-media3-common         = { group = "androidx.media3",        name = "media3-common",              version.ref = "media3" }
androidx-media3-session        = { group = "androidx.media3",        name = "media3-session",             version.ref = "media3" }
androidx-work-runtime-ktx      = { group = "androidx.work",          name = "work-runtime-ktx",           version.ref = "work" }
androidx-documentfile          = { group = "androidx.documentfile",  name = "documentfile",               version = "1.0.1" }
play-services-auth             = { group = "com.google.android.gms", name = "play-services-auth",         version.ref = "playServicesAuth" }

[plugins]
android-application  = { id = "com.android.application",             version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
chaquopy             = { id = "com.chaquo.python",                   version.ref = "chaquopy" }

