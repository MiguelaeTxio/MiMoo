name: Construir arbol de generos (MusicBrainz)

# Disparo MANUAL, nunca automatico. El rastreo son miles de peticiones
# a una por segundo: mas de una hora de ejecucion. Se lanza cuando se
# quiere refrescar el arbol, no en cada push.
on:
  workflow_dispatch:

jobs:
  build-genre-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rastrear MusicBrainz y construir el arbol
        run: python3 tools/build_genre_tree.py

      # Se sube ANTES de intentar commitear. El rastreo cuesta mas de
      # una hora y vive en una maquina efimera: si el commit falla, el
      # dato no se puede perder con el runner.
      - name: Salvar el arbol como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genre-tree
          path: app/src/main/assets/genre_tree.json
          if-no-files-found: error
          retention-days: 30

      - name: Commitear el arbol si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 'git add' primero: 'git diff' a secas no ve los archivos
          # nuevos sin seguimiento, y daba 'sin cambios' sobre un
          # archivo recien creado.
          git add app/src/main/assets/genre_tree.json
          if git diff --cached --quiet; then
            echo "El arbol no ha cambiado respecto al commit anterior."
            exit 0
          fi
          git commit -F - <<'EOF'
          data: regenerar el arbol de generos desde MusicBrainz

          Salida de tools/build_genre_tree.py, ejecutado a mano desde
          Actions. Recoge las relaciones genero-genero que MusicBrainz
          publica en las fichas HTML y que /ws/2 no expone.

          parents/children son parentesco real (subgenre of / subgenres).
          influencedBy/influenced quedan guardados aparte y NO deben
          recorrerse para decidir pertenencia al genero del ancla: es la
          arista por la que Tears for Fears se colaba en una radio de
          Dead Can Dance.
          EOF
          git push
