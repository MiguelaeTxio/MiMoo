name: Validar diccionario de éxitos contra YouTube (semilla de década)

# Disparo MANUAL. Orden final y explícita de Miguel Ángel (2026-08-24):
# decada sola y "Conocido en Espana" deben arrancar AL INSTANTE, igual
# que ya arranca al instante un genero con semilla -- la diferencia
# real es que la semilla de genero SI trae el youtube_id validado de
# antemano, y el diccionario de exitos nunca se valido. Este workflow
# hace esa validacion, UNA VEZ, contra YouTube real (yt-dlp), mismo
# criterio de filtro que PlayerManager.resolveYoutubeCandidate().
#
# Incremental de verdad: tools/validate_decade_hits.py guarda progreso
# tras CADA entrada -- se puede disparar varias veces seguidas sin
# perder lo ya validado, hasta cubrir el diccionario entero (miles de
# entradas, no cabe en una sola ejecucion).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limite de entradas a procesar (vacio = sin limite, todo el diccionario)'
        required: false
        default: ''

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      DECADE_SEED_LIMIT: ${{ github.event.inputs.limit }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yt-dlp
        run: pip install -U yt-dlp

      - name: Validar diccionario contra YouTube
        run: |
          set -x
          timeout --signal=KILL 20000 python3 tools/validate_decade_hits.py
          echo "codigo de salida real: $?"

      - name: Commitear el progreso (SIEMPRE, se complete o se corte por tiempo)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/mimooutcast_decade_seed.json tools/decade_seed_report.json tools/decade_seed_errors.json
          if git diff --cached --quiet; then
            echo "Sin progreso nuevo que commitear."
            exit 0
          fi
          git commit -m "data: progreso de validación de la semilla de década contra YouTube -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
