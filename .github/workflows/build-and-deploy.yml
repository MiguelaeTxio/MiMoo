name: Build and Deploy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Verificar RELEASES_REPO_LAST_TOKEN antes de compilar (diagnóstico rápido)
        run: |
          HTTP_CODE=$(curl -s -o /tmp/token_check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.RELEASES_REPO_LAST_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MiguelaeTxio/AndroidReleases")
          echo "HTTP status contra AndroidReleases: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ El secret RELEASES_REPO_LAST_TOKEN no es válido o no tiene acceso a AndroidReleases (código $HTTP_CODE)."
            echo "Respuesta de GitHub (sin exponer el token):"
            cat /tmp/token_check.json
            exit 1
          fi
          echo "✅ RELEASES_REPO_LAST_TOKEN válido y con acceso a AndroidReleases."

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Python 3.11 (requerido por Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # S011 -- Miguel Ángel se quedó al 90% de su cuota gratuita de
      # Actions (repos privados: 2.000 min/mes en el plan Free) sin
      # ninguna caché configurada -- cada build volvía a descargar
      # dependencias de Gradle y paquetes de Chaquopy/pip desde cero.
      # setup-gradle es la acción oficial y mantenida para cachear
      # Gradle (dependencias + wrapper + build cache), reemplaza a
      # configurar actions/cache a mano. La caché de pip es aparte --
      # Chaquopy instala yt-dlp vía pip durante el propio build de
      # Gradle (ver app/build.gradle.kts, sin versión fijada), y esa
      # descarga no pasa por la caché de Gradle.
      - name: Cachear Gradle (dependencias + wrapper + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cachear pip (paquetes de Chaquopy, yt-dlp)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Crear local.properties
        run: |
          echo "GOOGLE_OAUTH_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}" \
            >> local.properties

      - name: Restaurar keystore de debug fija
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Verificar huella SHA-256 de la keystore restaurada
        run: |
          echo "Tamaño del archivo:"
          ls -la ~/.android/debug.keystore
          echo "Huella SHA-256 esperada: B2:42:42:E0:99:62:55:A4:66:B6:70:56:EF:5D:4D:05:72:2B:4A:1A:AD:5A:9D:31:D4:48:4F:7B:D8:C8:49:8D"
          echo "Huella SHA-256 real:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"

      - name: Mostrar SHA-1 de firma (para OAuth Client ID Android en Google Cloud, H06)
        run: |
          echo "SHA-1 de la keystore de firma real -- usar tal cual en Google Auth Platform > Clients > Create client > Android:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} 2>&1 | tee /tmp/gradle.log

      # S025 -- los errores de compilacion como ANOTACIONES del check.
      #
      # El zip de logs de Actions redirige a
      # results-receiver.actions.githubusercontent.com, que no es
      # accesible desde el entorno donde se diagnostica, asi que un
      # fallo de compilacion obligaba a que Miguel Angel copiase el log
      # a mano. Emitiendo `::error::` por cada linea `e: file://` de
      # Kotlin, los errores quedan en
      # /repos/.../check-runs/{id}/annotations, que si es accesible por
      # API. Solo corre si la compilacion ha fallado.
      - name: Publicar errores de compilacion como anotaciones
        if: failure()
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            echo "::error::No hay /tmp/gradle.log"
            exit 0
          fi
          grep -E "^e: |error: |FAILURE: |What went wrong|Caused by:" /tmp/gradle.log \
            | head -40 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g; s/\r/%0D/g')
                echo "::error::${clean}"
              done

      - name: Subir APK a PythonAnywhere
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Token $PA_API_TOKEN" \
            -F "content=@app/build/outputs/apk/debug/app-debug.apk" \
            "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/files/path/home/MiguelAeTxio/ANDROID/MiMoo/apk/miMoo.apk"

      - name: Generar manifest.json de version (H07 PARTE 2, PASO 2.2)
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cat > manifest.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/MiguelaeTxio/AndroidReleases/releases/download/v${{ github.run_number }}/MiMoo.apk"
          }
          EOF
          echo "Manifiesto generado:"
          cat manifest.json
          python3 -m json.tool manifest.json > /dev/null && echo "[JSON OK]"

      - name: Preparar APK con nombre fijo para el asset de la Release
        run: cp app/build/outputs/apk/debug/app-debug.apk MiMoo.apk

      - name: Publicar Release en AndroidReleases (H07 PARTE 2, PASO 2.3)
        uses: softprops/action-gh-release@v2
        with:
          repository: MiguelaeTxio/AndroidReleases
          token: ${{ secrets.RELEASES_REPO_LAST_TOKEN }}
          tag_name: v${{ github.run_number }}
          name: MiMoo v${{ github.run_number }}
          files: |
            MiMoo.apk
            manifest.json
