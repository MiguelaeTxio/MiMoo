name: Cosechar listas de Spotify (Las 100 canciones del ano en Espana)

# Disparo MANUAL. Fuente nueva y gemela a Los 40, mismo pipeline de tres
# fases reutilizado sin tocar su codigo (variables de entorno apuntan a
# los ficheros nuevos en vez de a los de Los 40):
#
#   fase 1  harvest_spotify100_charts.py         cosecha cruda
#   fase 2  enrich_chart_artists.py               pais + genero
#   fase 3  merge_charts_into_dictionary.py        -> bloque es
#   fase 3b merge_intl_charts_into_dictionary.py   -> bloque intl
#
# S035 -- ni los logs del job ni el artefacto subido son legibles desde
# el entorno de trabajo del modelo (redirigen a subdominios de blob
# storage de Azure fuera de la lista blanca de red, distintos en cada
# ejecucion). Por eso el commit del fichero de diagnostico
# (chart_spotify100_debug.json) va SIEMPRE, con "if: always()" y
# SEPARADO del commit final de fusion -- este ultimo solo si la Fase 1
# termino de verdad bien.
on:
  workflow_dispatch:

jobs:
  harvest-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CHART_RAW_PATH: tools/chart_spotify100_raw.json
      CHART_ENRICHED_PATH: tools/chart_spotify100_enriched.json
      CHART_REJECTED_PATH: tools/chart_spotify100_rejected.json
      CHART_INTL_REJECTED_PATH: tools/chart_spotify100_intl_rejected.json
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar spotifyscraper
        run: pip install spotifyscraper

      - name: Sonda de aislamiento (S035, diagnostico de fallos silenciosos)
        run: |
          set -x
          timeout --signal=KILL 60 python3 tools/debug_spotify_probe.py
          echo "codigo de salida real de la sonda: $?"
          ls -la tools/chart_spotify100_probe_debug.json || echo "NO SE CREO EL FICHERO DE LA SONDA"

      - name: Commitear el resultado de la sonda (SIEMPRE, antes de la Fase 1)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/chart_spotify100_probe_debug.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin resultado de sonda que commitear."
            exit 0
          fi
          git commit -m "data: resultado de la sonda de aislamiento de Spotify -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      - name: Fase 1 -- Cosechar las listas de Spotify
        id: harvest
        run: |
          set -x
          timeout --signal=KILL 300 python3 tools/harvest_spotify100_charts.py
          exit $?

      - name: Commitear el diagnostico de la Fase 1 (SIEMPRE, exito o fallo)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/chart_spotify100_debug.json tools/chart_spotify100_raw.json tools/chart_spotify100_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin diagnostico nuevo que commitear."
            exit 0
          fi
          git commit -m "data: diagnostico de la cosecha de Spotify (Fase 1) -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      - name: Fase 2 -- Enriquecer con pais y genero
        run: python3 tools/enrich_chart_artists.py

      - name: Fase 3 -- Fusionar bloque espanol
        run: python3 tools/merge_charts_into_dictionary.py

      - name: Fase 3b -- Fusionar bloque internacional
        run: python3 tools/merge_intl_charts_into_dictionary.py

      - name: Salvar todo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-spotify100
          path: |
            tools/chart_spotify100_debug.json
            tools/chart_spotify100_raw.json
            tools/chart_spotify100_report.json
            tools/chart_spotify100_enriched.json
            tools/chart_spotify100_rejected.json
            tools/chart_spotify100_intl_rejected.json
            app/src/main/assets/known_hit_artists.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commitear la fusion final si ha cambiado algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/chart_spotify100_enriched.json \
                  tools/chart_spotify100_rejected.json \
                  tools/chart_spotify100_intl_rejected.json \
                  app/src/main/assets/known_hit_artists.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que commitear."
            exit 0
          fi
          git commit -F - <<'EOF'
          data: fusión de "Las 100 canciones del año en España" (Spotify) en known_hit_artists.json

          Pipeline completo (harvest -> enrich -> merge es -> merge intl),
          mismo mecanismo ya probado con Los 40 esta sesión, reutilizado
          sin tocar código -- solo variables de entorno apuntando a los
          ficheros nuevos. Fuente gemela e independiente de Los 40, con
          más profundidad por año (100 canciones representativas, no solo
          el número 1 semanal) y cobertura desde 1960.
          EOF
          git pull --rebase origin main
          git push
